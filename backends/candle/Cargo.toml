[package]
name = "ort-candle"
description = "ort + candle = 🦀 - An alternative backend for ort, powered by candle."
version = "0.6.0+0.11.1"
edition = "2024"
rust-version = "1.92"
license = "MIT OR Apache-2.0"
repository = "https://github.com/pykeio/ort"
homepage = "https://ort.pyke.io/backends/candle"
keywords = [ "machine-learning", "ai", "ml" , "sys"]
categories = [ "algorithms", "mathematics", "science" ]

[workspace]
resolver = "3"
members = [ "standalone" ]
default-members = []

[profile.release]
opt-level = 3
lto = true
strip = true
codegen-units = 1

[lib]
name = "ort_candle"
path = "lib.rs"

[features]

[workspace.dependencies]
ort-sys = { version = "=2.0.0-rc.15", path = "../../ort-sys", default-features = false, features = [ "api-24" ] }

[dependencies]
ort-sys = { workspace = true }
candle-core = { version = "=0.11.1", default-features = false }
candle-onnx = { version = "=0.11.1" }
prost = { version = "0.14.1", default-features = false }

[dev-dependencies]
ort = { version = "=2.0.0-rc.15", path = "../../", default-features = false, features = [ "std", "alternative-backend", "tls-rustls", "ndarray", "api-24" ] }
ndarray = "0.17"

[[test]]
name = "memory"
path = "tests/memory.rs"
[[test]]
name = "tensor"
path = "tests/tensor.rs"
[[test]]
name = "session"
path = "tests/session.rs"
